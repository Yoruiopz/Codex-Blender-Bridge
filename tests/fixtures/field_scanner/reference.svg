    <path d="M162.8 491H357.2"/><path d="M130 468V117"/><path d="M575.5 491H644.35"/><path d="M817 266H933"/>
  </g>
  <g font-family="Segoe UI, sans-serif" fill="#9ab6ce" font-size="12">
    <text x="238" y="513">144 mm</text><text x="91" y="298" transform="rotate(-90 91 298)">260 mm overall</text><text x="574" y="513">51 mm max depth</text>
    <text x="813" y="291">86 × 24 mm clear loop</text><text x="785" y="331">100 × 70 mm bezel opening</text><text x="785" y="353">Glass sits 0.8 mm behind bezel</text><text x="785" y="375">3 controls · 40 mm centre spacing</text>
    <text x="34" y="541">Reference geometry is illustrative. Inspect Blender dimensions, topology, clearance, UVs and protected state; review matched views separately.</text>
