name: Publish reviewed 0.9.0 alpha

on:
  push:
    branches:
      - codex/publish-reviewed-0.9.0

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-reviewed-0.9.0
  cancel-in-progress: false

jobs:
  publish:
    # Reviewed fixed inputs; Root enabled after qualification and privacy review.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'Yoruiopz/Codex-Blender-Bridge' &&
      github.ref == 'refs/heads/codex/publish-reviewed-0.9.0' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact reviewed support-branch push
        uses: actions/checkout@v4
        with:
          repository: Yoruiopz/Codex-Blender-Bridge
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Retrieve only the accepted immutable package artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Yoruiopz/Codex-Blender-Bridge
          run-id: 40693028059
          artifact-ids: 12818726232
          merge-multiple: true
          path: ${{ runner.temp }}/accepted-0.9.0-packages

