name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        mcp-version: ["2.0.0", "2.2.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]" "mcp==${{ matrix.mcp-version }}"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest --cov=mcp_server --cov-report=term-missing

      - name: Type check
        run: python -m mypy mcp_server

      - name: Compile Blender add-on
        run: python -m compileall -q addon/blender_codex_bridge

      - name: Build add-on archive
        run: python scripts/build_addon.py
